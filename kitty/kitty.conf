# Performance
repaint_delay    2
input_delay      0
sync_to_monitor  no

# Aesthetics
font_family      Maple Mono NF
font_size        13.0
cursor_trail     3
cursor_trail_decay 0.1 0.4
background_opacity 0.95
dynamic_background_opacity yes
window_padding_width 10

# Layouts
enabled_layouts splits,stack

# Keybindings for Splits (Similar to IDEs)
map cmd+d launch --location=vsplit
map cmd+shift+d launch --location=split
map cmd+w close_window

# Switch between windows
map cmd+left neighboring_window left
map cmd+right neighboring_window right
map cmd+up neighboring_window up
map cmd+down neighboring_window down

# Catppuccin-Mocha Theme
include catppuccin-mocha.conf

# Pitch Black Background
background #000000

# Opacity
background_opacity 0.85

# Dynamic Background
dynamic_background_opacity yes

# Blur the transparency (macOS only)
# This makes it look premium like the Warp or Apple Terminal glass effect
macos_titlebar_color system
background_blur 20

# Jump Tabs
map cmd+1        goto_tab 1
map cmd+2        goto_tab 2
map cmd+3        goto_tab 3
map cmd+4        goto_tab 4
map cmd+5        goto_tab 5
map cmd+6        goto_tab 6
map cmd+7        goto_tab 7
map cmd+8        goto_tab 8
map cmd+9        goto_tab 9
map cmd+shift+t select_tab

# Clipboard (Make it feel like a standard App)
map cmd+c           copy_to_clipboard
map cmd+v           paste_from_clipboard
